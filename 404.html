<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Page Not Found | Spirit Link Massage &amp; Acupuncture Centre</title>
    <meta name="robots" content="noindex, nofollow" />
    <link rel="icon" type="image/png" href="./browserLogo.png" />
    <style>
      :root {
        --tcm-cream: #FAF7F2;
        --tcm-gold: #C5A059;
        --tcm-wood: #2D241E;
        --tcm-bronze: #804A00;
      }
      body {
        margin: 0;
        padding: 0;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        background-color: var(--tcm-cream);
        color: var(--tcm-wood);
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        text-align: center;
        padding: 20px;
      }
      .card {
        background: #FFFFFF;
        border: 1px solid rgba(197, 160, 89, 0.35);
        padding: 40px 32px;
        max-width: 480px;
        box-sizing: border-box;
      }
      h1 {
        font-size: 1.75rem;
        margin: 0 0 12px;
        color: var(--tcm-bronze);
        font-weight: 700;
        font-family: "Cormorant Garamond", Georgia, serif;
      }
      p {
        font-size: 0.95rem;
        line-height: 1.6;
        margin: 0 0 24px;
        color: #5C5248;
      }
      .btn {
        display: inline-block;
        background-color: var(--tcm-gold);
        color: #FFFFFF;
        text-decoration: none;
        padding: 12px 28px;
        font-weight: 600;
        font-size: 0.9rem;
        letter-spacing: 0.05em;
        text-transform: uppercase;
        border: 1px solid var(--tcm-gold);
        transition: background-color 0.2s ease;
      }
      .btn:hover {
        background-color: #A07828;
      }
    </style>
    <script>
      // Single Page Application redirect script for GitHub Pages at /about/
      (function () {
        var pathname = window.location.pathname;
        var basePath = pathname.startsWith('/about') ? '/about/' : '/';
        var targetUrl = window.location.origin + basePath + (window.location.search || '') + (window.location.hash || '');
        if (pathname !== basePath && pathname !== '/about') {
          window.location.replace(targetUrl);
        }
      })();
    </script>
  </head>
  <body>
    <div class="card">
      <h1>Redirecting to Wellness...</h1>
      <p>
        Returning you to Spirit Link Massage &amp; Acupuncture Centre.
      </p>
      <a href="./" class="btn">Return to Homepage</a>
    </div>
  </body>
</html>
